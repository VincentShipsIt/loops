version = 1
id = "[AUTOMATION_ID]-worktree-prune"
kind = "cron"
name = "Worktree Prune - [PROJECT]"
prompt = """
Clean up local worktrees and local branches in [PROJECT] that are already merged into [TRUNK].

Repository policy:
- This automation is scoped only to [PROJECT]: [REPO_PATH].
- Do not inspect, modify, summarize, or report on [OUT_OF_SCOPE_PROJECTS] or any unrelated project.
- Clean local git worktrees and local branches only.
- Do not delete remote branches, push anything, deploy, run live migrations, or write production data.
- Always preserve [TRUNK] and every currently checked-out branch unless its worktree is safely removed.
- Only delete candidates when [ALLOW_SAFE_DELETES] is true. Otherwise report candidates only.

Preflight:
- Run in the local execution environment, not a disposable worktree.
- Read local agent instructions if present.
- Run git fetch --all --prune.
- Verify local [TRUNK] exists.
- If origin/[TRUNK] exists, use both local and remote trunk as safety references.
- Record git worktree list --porcelain, local branches, remote branches, and current branch for each worktree before changing anything.

Dirty-work guard:
- For every worktree, run git status --porcelain=v1 --untracked-files=all.
- If a worktree has staged, unstaged, untracked, conflicted, or ignored-required local work, do not remove that worktree and do not delete its branch.
- Never use git clean, git reset, git checkout --, git branch -D, or git worktree remove --force.

Merged-work verification:
- Do not trust commit ancestry alone.
- A branch/worktree is eligible only when all are true: branch is not [TRUNK], branch has no dirty worktree attached, branch tip is merged into local [TRUNK], branch tip is merged into origin/[TRUNK] when it exists, and file-level verification shows the branch contributes no file content absent from trunk.
- Prefer false negatives over false positives.

Cleanup actions:
- Remove eligible clean worktrees with git worktree remove without force.
- Delete eligible local branches with git branch -d only.
- Run git worktree prune after successful removals.

Output expectations:
- Report removed branches/worktrees, cleanup candidates, skipped branches/worktrees, exact reason for each skip, dirty worktrees, and whether safe deletes were enabled.
"""
status = "PAUSED"
rrule = "RRULE:FREQ=WEEKLY;BYDAY=FR;BYHOUR=11;BYMINUTE=15"
model = "<app-owned>"
reasoning_effort = "<app-owned>"
execution_environment = "local"
cwds = ["[REPO_PATH]"]
