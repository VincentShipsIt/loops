version = 1
id = "[AUTOMATION_ID]-pr-review"
kind = "cron"
name = "PR Review - [PROJECT]"
prompt = """
Review exactly one open pull request in [GITHUB_REPO]. The automation is strictly comment-only.

Scope and authority:
- Work only in [REPO_PATH] and [GITHUB_REPO]; do not inspect [OUT_OF_SCOPE_PROJECTS] or unrelated projects.
- Never edit repository files, create or switch branches, commit, push, merge, deploy, run live migrations, write production data, expose secrets, or open a pull request.

Selection and marker lifecycle:
- Discover the default branch directly from origin with git ls-remote --symref origin HEAD; accept only one symbolic ref: refs/heads/<default-branch> HEAD result and record it as default_branch.
- Fetch only that branch into its remote-tracking ref with git fetch --prune origin "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}", then record default_commit with git rev-parse "refs/remotes/origin/${default_branch}^{commit}". Never use or mutate a local default branch.
- List open non-draft PRs targeting default_branch, and review at most one. Stop if default-branch discovery or commit resolution is missing or ambiguous.
- For each candidate, read its current head SHA and look for <!-- [REVIEW_MARKER] automation=[AUTOMATION_ID] head=<head-sha> -->.
- Skip only when marker automation id and head SHA exactly match the current head. A changed head is eligible again.
- Missing, malformed, unreadable, or failed marker access is not successful dedupe; report it and continue conservatively.
- Pick the highest-risk eligible PR based on failing checks, touched surface, security/auth/persistence impact, or size. Stop cleanly if none exists.

Review:
- Inspect the selected PR at its exact current head SHA without checking it out or modifying files, and compare it with default_commit.
- Prioritize verified correctness, security, data loss, migration, auth/tenancy, concurrency, user-visible regression, maintainability, and missing-test findings. Avoid speculative or style-only comments.
- Post one concise review with actionable findings ordered by severity. Never repair the branch in this routine.
- If there are no findings, do not post a noisy approval message; proceed to the marker step.

Marker write:
- Only after the review comment succeeds, or after a finding-free review completes, write the exact hidden marker for the current head SHA and stable [AUTOMATION_ID].
- If marker posting fails, report it and do not claim the head was deduped.

Output expectations:
- Report PR, default_branch, default_commit, reviewed head SHA, findings, comment URL, marker status, skipped work, blockers, and residual risk.
"""
status = "PAUSED"
rrule = "RRULE:FREQ=HOURLY;INTERVAL=1;BYMINUTE=35;BYDAY=MO,TU,WE,TH,FR"
model = "<app-owned>"
reasoning_effort = "<app-owned>"
execution_environment = "worktree"
cwds = ["[REPO_PATH]"]
